name: Strip attribution lines from merge commit messages

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  strip-commit-message:
    runs-on: ubuntu-latest
    # Prevents infinite loop when this workflow itself force-pushes
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip Co-authored-by / Generated by from commit message
        run: |
          python3 - <<'EOF'
          import subprocess, sys

          msg = subprocess.check_output(['git', 'log', '-1', '--format=%B']).decode()
          lines = msg.split('\n')

          cleaned = [
              l for l in lines
              if not l.strip().lower().startswith('co-authored-by:')
              and 'generated by' not in l.lower()
          ]

          # Remove trailing blank lines and orphaned --- separators
          while cleaned and not cleaned[-1].strip():
              cleaned.pop()
          while cleaned and cleaned[-1].strip() == '---':
              cleaned.pop()
          while cleaned and not cleaned[-1].strip():
              cleaned.pop()

          result = '\n'.join(cleaned)

          if msg.rstrip('\n') == result:
              print('Nothing to strip.')
              sys.exit(0)

          subprocess.run(
              ['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'],
              check=True,
          )
          subprocess.run(
              ['git', 'config', 'user.name', 'github-actions[bot]'],
              check=True,
          )
          subprocess.run(['git', 'commit', '--amend', '-m', result], check=True)
          subprocess.run(
              ['git', 'push', '--force-with-lease', 'origin', 'master'],
              check=True,
          )
          print('Commit message cleaned and pushed.')
          EOF
