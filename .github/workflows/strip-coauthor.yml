name: Strip Co-authored-by / Generated by from PR description

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  strip-coauthor:
    runs-on: ubuntu-latest
    if: github.event.pull_request.body != null
    steps:
      - name: Remove Co-authored-by / Generated by lines from PR description
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const cleaned = body
              .split('\n')
              .filter((line) => !/^\s*Co-authored-by:/i.test(line) && !/Generated by/i.test(line))
              .join('\n');

            if (cleaned !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: cleaned,
              });
            }
