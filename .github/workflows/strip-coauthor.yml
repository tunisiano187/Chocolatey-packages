name: Strip Co-authored-by / Generated by from PR description

on:
  pull_request:
    types: [opened, edited, synchronize]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Numéro du PR à nettoyer'
        required: true
        type: number

permissions:
  pull-requests: write

jobs:
  strip-coauthor:
    runs-on: ubuntu-latest
    steps:
      - name: Remove Co-authored-by / Generated by lines from PR description
        uses: actions/github-script@v9
        with:
          script: |
            let prNumber;
            let body;

            if (context.eventName === 'workflow_dispatch') {
              prNumber = parseInt(context.payload.inputs.pull_request_number);
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              body = pr.body || '';
            } else {
              if (!context.payload.pull_request || !context.payload.pull_request.body) return;
              prNumber = context.payload.pull_request.number;
              body = context.payload.pull_request.body;
            }

            const cleaned = body
              .split('\n')
              .filter((line) => !/^\s*Co-authored-by:/i.test(line) && !/Generated by/i.test(line))
              .join('\n');

            if (cleaned !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                body: cleaned,
              });
            }
