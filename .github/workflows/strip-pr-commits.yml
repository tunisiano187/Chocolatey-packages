name: Rewrite PR commit messages to strip attribution lines

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  rewrite-commits:
    runs-on: ubuntu-latest
    # Prevents infinite loop when this workflow itself force-pushes
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Write amend helper
        run: |
          cat > /tmp/amend_commit.py << 'PYEOF'
          import subprocess, sys

          def clean_msg(msg):
              lines = msg.split('\n')
              cleaned = [
                  l for l in lines
                  if not l.strip().lower().startswith('co-authored-by:')
                  and 'generated by' not in l.lower()
              ]
              while cleaned and not cleaned[-1].strip():
                  cleaned.pop()
              while cleaned and cleaned[-1].strip() == '---':
                  cleaned.pop()
              while cleaned and not cleaned[-1].strip():
                  cleaned.pop()
              return '\n'.join(cleaned)

          msg = subprocess.check_output(['git', 'log', '-1', '--format=%B']).decode()
          cleaned = clean_msg(msg)

          if msg.rstrip('\n') != cleaned:
              subprocess.run(['git', 'commit', '--amend', '-m', cleaned], check=True)
              print('Amended.')
          else:
              print('Nothing to strip.')
          PYEOF

      - name: Rewrite commits and push
        env:
          BASE_REF: ${{ github.base_ref }}
          BRANCH: ${{ github.head_ref }}
        run: |
          BASE_SHA=$(git merge-base HEAD "origin/$BASE_REF")
          COMMIT_COUNT=$(git log --format=%H "$BASE_SHA..HEAD" | wc -l | tr -d ' ')

          if [ "$COMMIT_COUNT" -eq 0 ]; then
            echo "No commits to process."
            exit 0
          fi

          echo "Processing $COMMIT_COUNT commit(s) on $BRANCH..."
          ORIGINAL_SHA=$(git rev-parse HEAD)

          if ! git rebase "$BASE_SHA" --exec "python3 /tmp/amend_commit.py"; then
            git rebase --abort
            echo "Rebase failed, aborting."
            exit 1
          fi

          NEW_SHA=$(git rev-parse HEAD)

          if [ "$ORIGINAL_SHA" != "$NEW_SHA" ]; then
            git push --force-with-lease origin "$BRANCH"
            echo "Cleaned and pushed $COMMIT_COUNT commit(s)."
          else
            echo "No commits needed rewriting."
          fi
